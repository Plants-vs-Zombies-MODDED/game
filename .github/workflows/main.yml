name: Main

on:
    push:
      branches:
        - main
        - staging
    workflow_dispatch:

permissions:
    contents: write
    deployments: write

jobs:
    format-lint-stamp:
        runs-on: blacksmith-4vcpu-ubuntu-2404
        env:
            PNPM_HOME: /home/runner/.local/share/pnpm
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Setup Node.js & pnpm
              uses: actions/setup-node@v4
              with:
                  node-version: "lts/*"

            - name: Install pnpm
              run: |
                  corepack enable pnpm
                  mkdir -p "$PNPM_HOME"
                  echo "$PNPM_HOME" >> "$GITHUB_PATH"

            - name: Cache pnpm global packages
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.local/share/pnpm/global
                  key: pnpm-global-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: pnpm-global-

            - name: Install dependencies
              run: pnpm add -g oxlint oxfmt esbuild html-minifier-terser

            - name: Lint
              run: |
                  pnpm run fix || true

            - name: Format
              run: |
                  pnpm oxfmt --write . "**/*.{js,md,html,css,yml}"

            - name: Stamp
              run: |
                  echo "${{ github.sha }}" > game/images/Zombies/CX/v.html

            - name: Commit changes
              run: |
                  COMMIT_MSG=$(git log -1 --pretty=format:%s)
                  AUTHOR_EMAIL=$(git log -1 --pretty=format:%ae)
                  git config user.name github-actions
                  git config user.email github-actions@github.com
                  git add .
                  git commit -m "Format \"$COMMIT_MSG\" [CF-Pages-Skip]
                  Original commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
                  
                  Co-authored-by: ${{ github.actor }} <$AUTHOR_EMAIL>" || exit 0
                  git push

    mirror:
        runs-on: blacksmith-2vcpu-ubuntu-2404
        needs: format-lint-stamp
        if: always()
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pixta-dev/repository-mirroring-action@v1
              with:
                  target_repo_url: git@tangled.org:pvzm.net/game
                  ssh_private_key: ${{ secrets.TANGLED_SSH_PRIVATE_KEY }}
            - uses: pixta-dev/repository-mirroring-action@v1
              with:
                  target_repo_url: git@codeberg.org:pvzm/game.git
                  ssh_private_key: ${{ secrets.CODEBERG_SSH_PRIVATE_KEY }}
            - name: Build and upload feed artifact
              env:
                  FEED_PVZM_LOXODROME_SECRET: ${{ secrets.FEED_PVZM_LOXODROME_SECRET }}
              run: |
                  BRANCH="${{ github.ref_name }}"
                  SHA=$(git rev-parse HEAD)
                  ARCHIVE="${BRANCH}-${SHA}.tar.gz"
                  tar --exclude=.git -czf "$ARCHIVE" .
                  curl -fsSL -X POST \
                      -H "Authorization: ${FEED_PVZM_LOXODROME_SECRET}" \
                      -H "Content-Type: application/gzip" \
                      --data-binary @"$ARCHIVE" \
                      https://feed-pvzm.loxodrome.app
