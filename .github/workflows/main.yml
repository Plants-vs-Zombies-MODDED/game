name: Main

on:
    push:
      branches:
        - main
        - staging
    workflow_dispatch:

permissions:
    contents: write
    deployments: write
    actions: read   # needed to resolve the artifact download URL via the API

jobs:
    format-lint-stamp:
        runs-on: blacksmith-4vcpu-ubuntu-2404
        env:
            PNPM_HOME: /home/runner/.local/share/pnpm
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Setup Node.js & pnpm
              uses: actions/setup-node@v4
              with:
                  node-version: "lts/*"

            - name: Install pnpm
              run: |
                  corepack enable pnpm
                  mkdir -p "$PNPM_HOME"
                  echo "$PNPM_HOME" >> "$GITHUB_PATH"

            - name: Cache pnpm global packages
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.local/share/pnpm/global
                  key: pnpm-global-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: pnpm-global-

            - name: Install dependencies
              run: pnpm add -g oxlint oxfmt esbuild html-minifier-terser

            - name: Lint
              run: |
                  pnpm run fix || true

            - name: Format
              run: |
                  pnpm oxfmt --write . "**/*.{js,md,html,css,yml}"

            - name: Stamp
              run: |
                  echo "${{ github.sha }}" > game/images/Zombies/CX/v.html

            - name: Commit changes
              run: |
                  COMMIT_MSG=$(git log -1 --pretty=format:%s)
                  AUTHOR_EMAIL=$(git log -1 --pretty=format:%ae)
                  git config user.name github-actions
                  git config user.email github-actions@github.com
                  git add .
                  git commit -m "Format \"$COMMIT_MSG\" [CF-Pages-Skip]
                  Original commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}

                  Co-authored-by: ${{ github.actor }} <$AUTHOR_EMAIL>" || exit 0
                  git push

    mirror:
        runs-on: blacksmith-2vcpu-ubuntu-2404
        needs: format-lint-stamp
        if: always()
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pixta-dev/repository-mirroring-action@v1
              with:
                  target_repo_url: git@tangled.org:pvzm.net/game
                  ssh_private_key: ${{ secrets.TANGLED_SSH_PRIVATE_KEY }}
            - uses: pixta-dev/repository-mirroring-action@v1
              with:
                  target_repo_url: git@codeberg.org:pvzm/game.git
                  ssh_private_key: ${{ secrets.CODEBERG_SSH_PRIVATE_KEY }}

            - name: Build archive
              id: build_archive
              run: |
                  NAME="${{ github.ref_name }}-$(git rev-parse HEAD)"
                  tar --exclude=.git -czf "/tmp/${NAME}.tar.gz" .
                  echo "name=${NAME}" >> "$GITHUB_OUTPUT"

            - name: Upload archive as artifact
              id: upload_artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ steps.build_archive.outputs.name }}
                  path: /tmp/${{ steps.build_archive.outputs.name }}.tar.gz
                  retention-days: 1
                  compression-level: 0

            - name: Notify feed with a short-lived download link
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  FEED_PVZM_LOXODROME_SECRET: ${{ secrets.FEED_PVZM_LOXODROME_SECRET }}
                  ARTIFACT_ID: ${{ steps.upload_artifact.outputs.artifact-id }}
              run: |
                  HEADERS=$(mktemp)
                  curl -fsS -o /dev/null -D "$HEADERS" \
                      -H "Authorization: Bearer ${GH_TOKEN}" \
                      -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"

                  DOWNLOAD_URL=$(grep -i '^location:' "$HEADERS" | sed -E 's/^[Ll]ocation: *//' | tr -d '\r')
                  rm -f "$HEADERS"

                  if [ -z "$DOWNLOAD_URL" ]; then
                      echo "::error::Could not resolve artifact download URL"
                      exit 1
                  fi
                  echo "::add-mask::$DOWNLOAD_URL"

                  curl -fsSL -X POST \
                      -H "Content-Type: application/json" \
                      --data "{\"url\": \"${DOWNLOAD_URL}\", \"token\": \"${FEED_PVZM_LOXODROME_SECRET}\"}" \
                      https://feed-pvzm.loxodrome.app
                      
